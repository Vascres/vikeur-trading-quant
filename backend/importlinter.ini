[importlinter]
root_packages =
    calibration
    cost_model
    data_collector
    data_normalizer
    decision_engine
    execution_engine
    execution_mode_governance
    feature_engine
    journal
    liquidation_ingest
    meta_engine
    ml_engine
    notifications
    pair_execution
    portfolio
    regime_engine
    risk_engine
    strategies
    strategy_lifecycle

# Ces contrats opérationnalisent les frontières définies en Phase 2, §4-7.
# Objectif : empêcher qu'un import direct contourne les interfaces prévues,
# faiblesse identifiée dans l'auto-évaluation de la Phase 2.

[importlinter:contract:1]
name = Le moteur de décision ne connaît jamais l'exécution ni les exchanges
type = forbidden
source_modules =
    decision_engine
forbidden_modules =
    execution_engine
    data_collector

[importlinter:contract:2]
name = Le moteur de risque a le dernier mot : l'exécution ne parle qu'au risque, jamais directement à la décision
type = forbidden
source_modules =
    execution_engine
forbidden_modules =
    decision_engine

[importlinter:contract:3]
name = Le collecteur ne dépend de rien en interne (module le plus en amont)
type = forbidden
source_modules =
    data_collector
forbidden_modules =
    data_normalizer
    feature_engine
    decision_engine
    risk_engine
    execution_engine

[importlinter:contract:4]
name = Couches en ordre strict (collecte -> normalisation -> features -> regime -> meta_engine -> decision -> risque -> execution)
type = layers
layers =
    execution_engine
    risk_engine
    decision_engine
    meta_engine
    regime_engine
    feature_engine
    data_normalizer
    data_collector

[importlinter:contract:5]
name = Les stratégies restent des fonctions pures - aucune dépendance interne (Phase 10, §4)
type = forbidden
source_modules =
    strategies
forbidden_modules =
    data_collector
    data_normalizer
    feature_engine
    decision_engine
    risk_engine
    execution_engine

[importlinter:contract:6]
name = ml_engine reste isolé du flux live (Phase 16, §1) - garde-fou technique, pas seulement documentaire
type = forbidden
source_modules =
    decision_engine
    strategies
    risk_engine
    execution_engine
    feature_engine
forbidden_modules =
    ml_engine

[importlinter:contract:7]
name = portfolio est la seule porte d'entrée vers le capital réel (ADR-0003/0007) - personne d'autre n'appelle l'exchange pour le solde
type = forbidden
source_modules =
    risk_engine
    decision_engine
    execution_engine
    feature_engine
forbidden_modules =
    portfolio.htx_provider

[importlinter:contract:8]
name = portfolio ne dépend jamais de la décision, du risque, ou de l'exécution (module de lecture de capital, pas de trading)
type = forbidden
source_modules =
    portfolio
forbidden_modules =
    decision_engine
    risk_engine
    execution_engine
    strategies

[importlinter:contract:9]
name = execution_mode_governance est un module de gouvernance/config, jamais un chemin détourné vers la décision ou l'exécution (ADR-0004/0008)
type = forbidden
source_modules =
    execution_mode_governance
forbidden_modules =
    data_collector
    data_normalizer
    feature_engine
    decision_engine
    risk_engine
    execution_engine
    strategies
    portfolio.htx_provider

[importlinter:contract:10]
name = calibration reste un service statistique isolé - jamais un chemin détourné vers la décision, le risque ou l'exécution (ADR-0009)
type = forbidden
source_modules =
    calibration
forbidden_modules =
    data_collector
    data_normalizer
    feature_engine
    decision_engine
    risk_engine
    execution_engine
    strategies
    portfolio.htx_provider

[importlinter:contract:11]
name = cost_model reste un service de mesure isolé - jamais un chemin détourné vers la décision, le risque ou l'exécution (ADR-0016) ; le fee_schedule mesuré est lu en SQL direct par ses consommateurs, jamais via un import de ce package
type = forbidden
source_modules =
    cost_model
forbidden_modules =
    data_normalizer
    feature_engine
    decision_engine
    risk_engine
    execution_engine
    strategies
    portfolio.htx_provider

[importlinter:contract:12]
name = pair_execution contourne délibérément la fusion (ADR-0021 §2) - jamais un import de decision_engine/risk_engine/strategies ; réutilise execution_engine.positions pour le suivi des jambes, seule exception documentée
type = forbidden
source_modules =
    pair_execution
forbidden_modules =
    data_collector
    data_normalizer
    feature_engine
    decision_engine
    risk_engine
    strategies
    portfolio.htx_provider

[importlinter:contract:13]
name = strategy_lifecycle reste un service de mesure isolé (Étape 3, 16/08/2026) - jamais un chemin détourné vers la décision, le risque ou l'exécution ; l'état de lifecycle est lu en SQL direct par ses consommateurs, jamais via un import de ce package
type = forbidden
source_modules =
    strategy_lifecycle
forbidden_modules =
    data_collector
    data_normalizer
    feature_engine
    decision_engine
    risk_engine
    execution_engine
    strategies
    portfolio.htx_provider

[importlinter:contract:15]
name = journal reste un simple relais de persistance (correctif du 16/08/2026) - jamais un chemin détourné vers la décision, le risque ou l'exécution (aucun accès sauf Redis pub/sub et l'écriture de events_journal)
type = forbidden
source_modules =
    journal
forbidden_modules =
    data_collector
    data_normalizer
    feature_engine
    decision_engine
    risk_engine
    execution_engine
    strategies
    strategy_lifecycle
    cost_model
    calibration
    portfolio
    execution_mode_governance

[importlinter:contract:14]
name = notifications reste un consommateur passif du journal d'événements (Étape 10, 16/08/2026) - jamais un chemin détourné vers la décision, le risque, l'exécution ou toute donnée applicative (aucun accès DB, uniquement Redis pub/sub et l'API Telegram)
type = forbidden
source_modules =
    notifications
forbidden_modules =
    data_collector
    data_normalizer
    feature_engine
    decision_engine
    risk_engine
    execution_engine
    strategies
    strategy_lifecycle
    cost_model
    calibration
    portfolio
    execution_mode_governance

[importlinter:contract:16]
name = liquidation_ingest reste un service de collecte isolé (chantier de données Liquidation Cascade, 16/08/2026) - jamais un chemin détourné vers la décision, le risque ou l'exécution ; importe data_collector.adapters (même précédent que cost_model, contrat 11) pour réutiliser BinanceFuturesAdapter, jamais data_collector.main
type = forbidden
source_modules =
    liquidation_ingest
forbidden_modules =
    data_normalizer
    feature_engine
    decision_engine
    risk_engine
    execution_engine
    strategies
    strategy_lifecycle
    cost_model
    calibration
    portfolio
    execution_mode_governance
