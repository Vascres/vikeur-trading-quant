name: Build and Push Images

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend, backup]

    steps:
      - uses: actions/checkout@v4

      - name: Préparer Buildx (nécessaire pour le cache type=gha)
        uses: docker/setup-buildx-action@v3

      - name: Normaliser le propriétaire du dépôt en minuscules (contrainte GHCR)
        id: vars
        run: echo "owner_lower=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Se connecter au registre GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et pousser l'image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner_lower }}/projet-quant-${{ matrix.component }}:latest
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner_lower }}/projet-quant-${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# Note : ce workflow construit et publie les images à chaque fusion sur main,
# mais NE déploie jamais automatiquement sur le VPS (cf. Phase 5, §3.2 —
# le déploiement reste un acte manuel via infra/deploy.sh).
